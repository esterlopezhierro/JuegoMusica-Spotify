<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify Random Secret Song</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .blur-hidden {
            filter: blur(20px);
            opacity: 0.2;
            transform: scale(0.95);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .blur-visible {
            filter: blur(0);
            opacity: 1;
            transform: scale(1);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="h-full flex justify-center items-center p-2 sm:p-4 bg-slate-950 select-none overflow-hidden">

    <div class="relative w-full max-w-md h-[92vh] max-h-[850px] bg-slate-900 border border-slate-800 rounded-[40px] shadow-2xl flex flex-col justify-between overflow-hidden">

        <header class="p-5 flex justify-between items-center z-20">
            <div class="flex items-center gap-2">
                <i class="fa-brands fa-spotify text-emerald-500 text-2xl"></i>
                <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Canción Secreta</span>
            </div>
            <button onclick="toggleConfigModal()" class="w-10 h-10 rounded-full bg-slate-800/80 text-slate-300 flex items-center justify-center hover:bg-slate-700 transition active:scale-95 cursor-pointer">
                <i class="fa-solid fa-gear"></i>
            </button>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center px-6 relative">

            <div class="relative w-64 h-64 sm:w-72 sm:h-72 mb-6 rounded-3xl bg-slate-800 border border-slate-700/50 shadow-2xl overflow-hidden flex items-center justify-center">
                <img id="albumCover" class="w-full h-full object-cover blur-hidden" src="" alt="Album Cover">
                <div id="mysteryOverlay" class="absolute flex flex-col items-center justify-center text-slate-600 transition-opacity duration-300">
                    <i class="fa-solid fa-compact-disc text-7xl animate-spin" style="animation-duration: 12s;"></i>
                    <p class="text-xs font-semibold mt-4 tracking-widest uppercase text-slate-500">¿Qué canción es?</p>
                </div>
            </div>

            <div class="w-full max-w-xs mb-4 flex items-center justify-center gap-3">
                <button onclick="togglePlayback()" class="w-12 h-12 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center hover:bg-emerald-400 transition active:scale-95">
                    <i id="playIcon" class="fa-solid fa-pause"></i>
                </button>
                <span class="text-xs text-slate-400">Suena en tu app de Spotify</span>
            </div>

            <div id="songInfo" class="text-center w-full min-h-[80px] flex flex-col justify-center blur-hidden transition-all duration-500">
                <h1 id="songTitle" class="text-xl sm:text-2xl font-extrabold text-white truncate px-2">Título</h1>
                <p id="artistName" class="text-base font-semibold text-emerald-400 mt-1 truncate">Artista</p>
                <p id="releaseYear" class="text-xs font-medium text-slate-400 mt-1 tracking-widest uppercase">Año</p>
            </div>

        </main>

        <footer class="p-6 pb-8 flex flex-col items-center gap-4 bg-slate-900/80 backdrop-blur-md border-t border-slate-800/80 z-10">
            <div class="w-full flex items-center justify-around max-w-xs">
                <button onclick="nextSong()" class="w-16 h-16 rounded-full bg-slate-800 text-slate-200 flex items-center justify-center hover:bg-slate-700 transition active:scale-95 shadow-md">
                    <i class="fa-solid fa-forward-step text-xl"></i>
                </button>
                <button id="revealBtn" onclick="revealSongDetails()" class="w-16 h-16 rounded-full bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-500 transition active:scale-95 shadow-md shadow-indigo-600/30">
                    <i id="revealIcon" class="fa-solid fa-eye text-xl"></i>
                </button>
            </div>
            <span id="statusLabel" class="text-xs text-slate-400 font-medium text-center">Pulsa ⚙️ para conectar tu Spotify</span>
        </footer>

    </div>

    <!-- Configuration Modal -->
    <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl relative text-left">
            <button onclick="toggleConfigModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h2 class="text-lg font-bold text-white flex items-center gap-2 mb-2">
                <i class="fa-brands fa-spotify text-emerald-500"></i> Conectar con Spotify
            </h2>
            <p class="text-xs text-slate-400 mb-6">
                Necesitas Spotify Premium. Antes de empezar, pon tu playlist en Spotify con el aleatorio activado y dale a play.
            </p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Spotify Client ID</label>
                    <input type="text" id="clientIdInput" placeholder="Pega tu Client ID aquí" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <button onclick="redirectToSpotifyAuth()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                    <i class="fa-brands fa-spotify text-lg"></i> Conectar con Spotify
                </button>
            </div>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'spotify_access_token_v2';

        let isRevealed = false;
        let isPlaying = true;
        let lastTrackId = null;
        let accessToken = localStorage.getItem(TOKEN_KEY) || null;
        let clientId = localStorage.getItem('spotify_client_id') || '';

        const albumCover = document.getElementById('albumCover');
        const songInfo = document.getElementById('songInfo');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');
        const releaseYear = document.getElementById('releaseYear');
        const mysteryOverlay = document.getElementById('mysteryOverlay');
        const revealBtn = document.getElementById('revealBtn');
        const revealIcon = document.getElementById('revealIcon');
        const statusLabel = document.getElementById('statusLabel');
        const playIcon = document.getElementById('playIcon');

        window.onload = async () => {
            document.getElementById('clientIdInput').value = clientId;

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                await fetchAccessToken(code);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (accessToken) {
                statusLabel.innerText = "¡Conectado! Buscando lo que suena...";
                await refreshNowPlaying(true);
                setInterval(() => refreshNowPlaying(false), 3000);
            } else {
                toggleConfigModal();
            }
        };

        function toggleConfigModal() {
            document.getElementById('configModal').classList.toggle('hidden');
        }

        function generateRandomString(length) {
            let text = '';
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        async function redirectToSpotifyAuth() {
            clientId = document.getElementById('clientIdInput').value.trim();
            if (!clientId) {
                alert("Por favor, introduce tu Client ID.");
                return;
            }
            localStorage.setItem('spotify_client_id', clientId);

            const verifier = generateRandomString(128);
            localStorage.setItem('code_verifier', verifier);

            const challenge = await generateCodeChallenge(verifier);
            const redirectUri = window.location.origin + window.location.pathname;

            const args = new URLSearchParams({
                response_type: 'code',
                client_id: clientId,
                scope: 'user-modify-playback-state user-read-playback-state',
                redirect_uri: redirectUri,
                code_challenge_method: 'S256',
                code_challenge: challenge
            });

            window.location.href = 'https://accounts.spotify.com/authorize?' + args.toString();
        }

        async function fetchAccessToken(code) {
            const verifier = localStorage.getItem('code_verifier');
            const redirectUri = window.location.origin + window.location.pathname;

            const params = new URLSearchParams({
                client_id: clientId,
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: redirectUri,
                code_verifier: verifier
            });

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                const data = await response.json();
                if (data.access_token) {
                    accessToken = data.access_token;
                    localStorage.setItem(TOKEN_KEY, accessToken);
                } else {
                    console.error("Respuesta de token:", data);
                }
            } catch (err) {
                console.error("Error token:", err);
            }
        }

        function sessionExpired() {
            localStorage.removeItem(TOKEN_KEY);
            accessToken = null;
            statusLabel.innerText = "La sesión ha caducado. Vuelve a conectar.";
            toggleConfigModal();
        }

        // Consulta qué está sonando y actualiza la pantalla si ha cambiado la canción
        async function refreshNowPlaying(showMessages) {
            if (!accessToken) return;
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (res.status === 401) { sessionExpired(); return; }

                if (res.status === 204) {
                    if (showMessages) statusLabel.innerText = "No hay nada sonando. Abre Spotify y dale a play a tu playlist.";
                    return;
                }
                if (!res.ok) {
                    if (showMessages) statusLabel.innerText = `Spotify respondió ${res.status} al consultar qué suena.`;
                    return;
                }

                const data = await res.json();
                isPlaying = !!data.is_playing;
                playIcon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';

                const track = data.item;
                if (!track || track.type === 'episode') return;

                if (track.id !== lastTrackId) {
                    lastTrackId = track.id;
                    hideSongDetails();
                    albumCover.src = track.album?.images?.[0]?.url || '';
                    songTitle.innerText = track.name;
                    artistName.innerText = (track.artists || []).map(a => a.name).join(', ');
                    const date = track.album?.release_date;
                    releaseYear.innerText = "Año: " + (date ? date.split('-')[0] : 'N/A');
                    statusLabel.innerText = "¿Qué canción es? Pulsa el ojo para desvelarla.";
                }
            } catch (err) {
                console.error(err);
                if (showMessages) statusLabel.innerText = `Error: ${err.name} - ${err.message}`;
            }
        }

        async function nextSong() {
            if (!accessToken) { toggleConfigModal(); return; }
            statusLabel.innerText = "Pasando a la siguiente...";
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/next', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (res.status === 401) { sessionExpired(); return; }
                if (!res.ok) {
                    const txt = await res.text();
                    console.error("Error next:", res.status, txt);
                    statusLabel.innerText = `Spotify respondió ${res.status}: ${txt.slice(0, 120)}`;
                    return;
                }

                // Spotify tarda un momento en cambiar de canción
                setTimeout(() => refreshNowPlaying(true), 900);
            } catch (err) {
                console.error(err);
                statusLabel.innerText = `Error: ${err.name} - ${err.message}`;
            }
        }

        async function togglePlayback() {
            if (!accessToken) { toggleConfigModal(); return; }
            const action = isPlaying ? 'pause' : 'play';
            try {
                const res = await fetch(`https://api.spotify.com/v1/me/player/${action}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (res.status === 401) { sessionExpired(); return; }
                if (res.ok || res.status === 204) {
                    isPlaying = !isPlaying;
                    playIcon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
                } else {
                    statusLabel.innerText = `Spotify respondió ${res.status} al pausar/reanudar.`;
                }
            } catch (err) {
                console.error(err);
                statusLabel.innerText = `Error: ${err.name} - ${err.message}`;
            }
        }

        function revealSongDetails() {
            if (isRevealed) return;
            isRevealed = true;

            albumCover.
